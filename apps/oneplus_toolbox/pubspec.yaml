name: oneplus_toolbox
description: 一加工具箱 Flutter 版（界面层）。只依赖 toolbox_service，不直接调用任何命令。
publish_to: 'none'

# 与 TS 版 package.json 的 version 保持一致；构建时也可用 --dart-define=TOOLBOX_VERSION=x.y.z 覆盖
version: 0.1.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  path: ^1.9.0
  path_provider: ^2.1.3
  toolbox_service:
    path: ../../packages/toolbox_service
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
